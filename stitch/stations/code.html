<body class="bg-background text-on-surface antialiased overflow-x-hidden pb-32">
<!-- Top App Bar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-margin-edge h-16 bg-surface-elevated/95 backdrop-blur-[20px] dark:bg-surface-elevated/95 border-b border-glass-stroke">

<h1 class="text-headline-md font-headline-md tracking-tight text-on-surface dark:text-on-surface">SonicStream</h1>
</div>
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-white/5 transition-colors active:scale-95 duration-100">
<span class="material-symbols-outlined text-on-surface-variant dark:text-on-surface-variant" data-icon="account_circle">account_circle</span>
</button>

</div>
</div>
<div class="flex items-center justify-between mb-4">

<div class="flex items-center gap-3">

</button>

</div>
</div>

<div class="flex items-center gap-3">

<!-- Mini-Player -->
<div class="fixed bottom-24 left-margin-edge right-margin-edge z-40 bg-surface-elevated/95 backdrop-blur-[24px] border border-glass-stroke rounded-2xl p-3 flex items-center shadow-2xl">

</button>
<button class="w-10 h-10 flex items-center justify-center text-on-surface active:scale-90 transition-transform">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
<!-- Progress Bar ( pinned to bottom ) -->
<div class="absolute bottom-0 left-0 h-0.5 bg-primary rounded-full transition-all duration-1000" style="width: 65%;"></div>
</div>
<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 py-3 pb-safe bg-surface-elevated/95 backdrop-blur-[20px] dark:bg-surface-elevated/95 border-t border-glass-stroke">
<!-- Stations Active -->
<a class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-full px-5 py-1 active:scale-90 duration-150 group" href="#">
<span class="material-symbols-outlined" data-icon="radio" data-weight="fill" style="font-variation-settings: 'FILL' 1;">radio</span>
<span class="text-label-sm font-label-sm mt-0.5">Stations</span>
</a>
<!-- Favorites Inactive -->
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:text-on-surface transition-all active:scale-90 duration-150" href="#">
<span class="material-symbols-outlined" data-icon="favorite">favorite</span>
<span class="text-label-sm font-label-sm mt-0.5">Favorites</span>
</a>

<script>
        // Simple Interaction logic
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', function(e) {
                // Haptic feedback simulation or ripple could go here
            });
        });

        // Simulating the Live Dot pulse and Progress bar movement
        const progressBar = document.querySelector('.absolute.bottom-0.left-0');
        let progress = 65;
        setInterval(() => {
            progress = (progress + 0.1) % 100;
            progressBar.style.width = progress + '%';
        }, 1000);
    </script>
